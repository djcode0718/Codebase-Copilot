relationship:
  regex_patterns:
    - "\\b(?:what|who|which)\\s+(?:functions|modules|files|classes|methods|code|packages|elements)?\\s*(?:call|calls|import|imports|use|uses|depend|depends|reference|references|instantiate|instantiates|create|creates)\\b"
    - "\\b(?:where|how)\\s+is\\s+.*\\s+(?:called|imported|used|referenced|instantiated|created)\\b"
    - "\\bwhat\\s+(?:would\\s+)?(?:break|be\\s+affected)\\s+if\\s+.*\\s+(?:delete|deleted|remove|removed)\\b"
    - "\\bwho\\s+depends\\s+on\\b"
    - "\\b(?:dependencies|dependents|imports|callers)\\s+of\\b"
    - "\\bwhich\\s+modules?\\s+depend(?:s)?\\s+on\\b"
  phrases:
    - "what calls "
    - "who calls "
    - "where is called"
    - "what imports "
    - "who imports "
    - "what depends on "
    - "who uses "
    - "what breaks if"
    - "what would break if"
    - "what is affected if"
    - "which modules depend on"
    - "who instantiates"
    - "what instantiates"
    - "who creates"
    - "what creates"
