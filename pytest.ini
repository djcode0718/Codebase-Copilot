[pytest]
# ── pytest configuration ──────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Enable asyncio mode for async dependency tests
asyncio_mode = auto

# Verbosity
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header

# Custom markers
markers =
    unit: Pure unit tests (no HTTP, no I/O)
    integration: Tests that use the FastAPI TestClient
    slow: Tests that take a long time (LLM, eval pipeline)

filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.

