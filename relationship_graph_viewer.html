<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Relationship Graph Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #f0883e;
    --node: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  input#search {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    width: 320px;
    outline: none;
  }
  input#search:focus { border-color: var(--accent); }
  button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active { border-color: var(--accent); color: var(--accent); }
  #main { flex: 1; display: flex; overflow: hidden; }
  #graph { flex: 1; position: relative; }
  #sidebar {
    width: 300px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 14px;
    font-size: 12px;
  }
  #sidebar h3 { font-size: 13px; margin: 0 0 8px 0; color: var(--accent); }
  #sidebar .item {
    padding: 6px 8px;
    margin-bottom: 4px;
    background: var(--bg);
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
    word-break: break-all;
  }
  #sidebar .item:hover { border-color: var(--accent); }
  #autocomplete {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    width: 320px;
    display: none;
  }
  #autocomplete div {
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  #autocomplete div:hover { background: var(--bg); color: var(--accent); }
  .empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); font-size: 13px; text-align: center; flex-direction: column; gap: 8px;
  }
  .legend {
    position: absolute; bottom: 14px; left: 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 11px; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .node-label { fill: var(--text); font-size: 10px; pointer-events: none; }
  .link { stroke: #30363d; stroke-width: 1.2px; }
  .stats { color: var(--muted); font-size: 11px; margin-left: auto; }
</style>
</head>
<body>

<header>
  <h1>Relationship Graph Viewer</h1>
  <span class="sub">Codebase-Copilot</span>
  <div style="position:relative;">
    <input id="search" placeholder="Search a symbol or file (e.g. classify_query)..." autocomplete="off">
    <div id="autocomplete"></div>
  </div>
  <button id="btnFull">Show Overview (top connected)</button>
  <button id="btnClear">Clear</button>
  <div class="stats" id="stats"></div>
</header>

<div id="main">
  <div id="graph"><div class="empty" id="emptyState">Search for a symbol above (e.g. <code>classify_query</code>) to see what references it,<br>or click "Show Overview" to see the most-connected symbols in the codebase.</div></div>
  <div id="sidebar">
    <h3>Details</h3>
    <div id="details" class="sub">Nothing selected yet.</div>
  </div>
</div>

const allKeys = Object.keys(GRAPH_DATA);
document.getElementById('stats').textContent = allKeys.length + ' symbols indexed';

const searchInput = document.getElementById('search');
const autocomplete = document.getElementById('autocomplete');
const graphDiv = document.getElementById('graph');
const detailsDiv = document.getElementById('details');
const emptyState = document.getElementById('emptyState');

let svg, simulation;

function clearGraph() {
  d3.select('#graph').selectAll('svg').remove();
  emptyState.style.display = 'flex';
  detailsDiv.innerHTML = 'Nothing selected yet.';
}

function fileBase(p) {
  const parts = p.split('/');
  return parts[parts.length - 1].split(':')[0];
}

function colorFor(id) {
  if (GRAPH_DATA.hasOwnProperty(id)) return 'var(--node)'; // has its own entry (referenced by others)
  return 'var(--accent2)';
}

function renderNeighborhood(centerId) {
  emptyState.style.display = 'none';
  d3.select('#graph').selectAll('svg').remove();

  const refs = GRAPH_DATA[centerId] || [];
  const nodesMap = new Map();
  nodesMap.set(centerId, {id: centerId, type: 'center'});
  refs.forEach(r => nodesMap.set(r, {id: r, type: 'ref'}));

  const nodes = Array.from(nodesMap.values());
  const links = refs.map(r => ({source: centerId, target: r}));

  const width = graphDiv.clientWidth;
  const height = graphDiv.clientHeight;

  svg = d3.select('#graph').append('svg')
    .attr('width', width).attr('height', height);

  const g = svg.append('g');

  svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', (event) => {
    g.attr('transform', event.transform);
  }));

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide(46));

  const link = g.append('g').selectAll('line')
    .data(links).enter().append('line')
    .attr('class', 'link');

  const node = g.append('g').selectAll('g')
    .data(nodes).enter().append('g')
    .style('cursor', 'pointer')
    .call(drag(simulation))
    .on('click', (event, d) => selectSymbol(d.id));

  node.append('circle')
    .attr('r', d => d.type === 'center' ? 18 : 10)
    .attr('fill', d => d.type === 'center' ? '#58a6ff' : (GRAPH_DATA.hasOwnProperty(d.id) ? '#3fb950' : '#f0883e'))
    .attr('stroke', '#0d1117')
    .attr('stroke-width', 2);

  node.append('text')
    .attr('class', 'node-label')
    .attr('x', d => d.type === 'center' ? 22 : 14)
    .attr('y', 4)
    .text(d => fileBase(d.id));

  node.append('title').text(d => d.id);

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  showDetails(centerId, refs);
}

function showDetails(centerId, refs) {
  let html = `<div style="color:var(--accent); font-weight:600; margin-bottom:6px; word-break:break-all;">${centerId}</div>`;
  if (!refs || refs.length === 0) {
    html += `<div class="sub">No references found for this symbol.</div>`;
  } else {
    html += `<div class="sub" style="margin-bottom:8px;">${refs.length} reference${refs.length > 1 ? 's' : ''} found:</div>`;
    refs.forEach(r => {
      html += `<div class="item" onclick="selectSymbol('${r.replace(/'/g, "\\'")}')">${r}</div>`;
    });
  }
  detailsDiv.innerHTML = html;
}

function selectSymbol(id) {
  searchInput.value = id;
  autocomplete.style.display = 'none';
  if (GRAPH_DATA.hasOwnProperty(id)) {
    renderNeighborhood(id);
  } else {
    // no outgoing entry, but might still be referenced elsewhere - search reverse
    detailsDiv.innerHTML = `<div style="color:var(--accent); font-weight:600; margin-bottom:6px; word-break:break-all;">${id}</div><div class="sub">This symbol has no entry as a key (not called/imported elsewhere), or it's a leaf reference.</div>`;
    d3.select('#graph').selectAll('svg').remove();
    emptyState.style.display = 'flex';
    emptyState.innerHTML = `No graph data available as a root for <b>${id}</b>.<br>It may only appear as a reference inside another symbol's list.`;
  }
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { autocomplete.style.display = 'none'; return; }
  const matches = allKeys.filter(k => k.toLowerCase().includes(q)).slice(0, 30);
  if (matches.length === 0) { autocomplete.style.display = 'none'; return; }
  autocomplete.innerHTML = matches.map(m => `<div data-id="${m}">${m}</div>`).join('');
  autocomplete.style.display = 'block';
  autocomplete.querySelectorAll('div').forEach(el => {
    el.addEventListener('click', () => selectSymbol(el.dataset.id));
  });
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim();
    if (GRAPH_DATA.hasOwnProperty(q)) { selectSymbol(q); return; }
    const match = allKeys.find(k => k.toLowerCase() === q.toLowerCase());
    if (match) selectSymbol(match);
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#search') && !e.target.closest('#autocomplete')) {
    autocomplete.style.display = 'none';
  }
});

document.getElementById('btnClear').addEventListener('click', () => {
  searchInput.value = '';
  clearGraph();
  emptyState.innerHTML = 'Search for a symbol above (e.g. <code>classify_query</code>) to see what references it,<br>or click "Show Overview" to see the most-connected symbols in the codebase.';
});

document.getElementById('btnFull').addEventListener('click', () => {
  emptyState.style.display = 'none';
  d3.select('#graph').selectAll('svg').remove();

  // Build overview: top 40 most-referenced symbols, connected to their top few referencers
  const scored = allKeys.map(k => ({id: k, count: GRAPH_DATA[k].length}))
    .sort((a,b) => b.count - a.count)
    .slice(0, 40);

  const nodesMap = new Map();
  const links = [];
  scored.forEach(s => {
    nodesMap.set(s.id, {id: s.id, type: 'hub', count: s.count});
    GRAPH_DATA[s.id].slice(0, 4).forEach(r => {
      if (!nodesMap.has(r)) nodesMap.set(r, {id: r, type: 'ref', count: 0});
      links.push({source: s.id, target: r});
    });
  });

  const nodes = Array.from(nodesMap.values());
  const width = graphDiv.clientWidth;
  const height = graphDiv.clientHeight;

  svg = d3.select('#graph').append('svg').attr('width', width).attr('height', height);
  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.1, 4]).on('zoom', (event) => g.attr('transform', event.transform)));

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(90))
    .force('charge', d3.forceManyBody().strength(-140))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide(30));

  const link = g.append('g').selectAll('line').data(links).enter().append('line').attr('class','link');
  const node = g.append('g').selectAll('g').data(nodes).enter().append('g')
    .style('cursor','pointer').call(drag(simulation))
    .on('click', (event, d) => selectSymbol(d.id));

  node.append('circle')
    .attr('r', d => d.type === 'hub' ? Math.min(8 + d.count, 26) : 6)
    .attr('fill', d => d.type === 'hub' ? '#58a6ff' : '#8b949e')
    .attr('stroke', '#0d1117').attr('stroke-width', 1.5);

  node.append('text').attr('class','node-label')
    .attr('x', 10).attr('y', 3)
    .text(d => d.type === 'hub' ? fileBase(d.id) + ' (' + d.count + ')' : '');

  node.append('title').text(d => d.id);

  simulation.on('tick', () => {
    link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y).attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  detailsDiv.innerHTML = `<div class="sub">Showing the 40 most-referenced symbols/files, with their top referencing sources.<br><br>Click any node to drill into its full reference list.</div>`;
});

function drag(simulation) {
  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
  return d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended);
}
</script>

</body>
</html>
